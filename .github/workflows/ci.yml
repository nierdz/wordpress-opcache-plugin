name: CI

on: push

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install dependencies
        run: python -m pip install --upgrade pip virtualenv
      - name: install pre-commit and composer packages
        run: make install
      - name: run tests
        run: make tests
      - name: start dev stack
        run: docker compose up -d
      - name: run functional tests
        run: |
          set -euo pipefail

          wordpress_health=""
          for _ in {1..60}; do
            wordpress_health=$(docker inspect -f '{{.State.Health.Status}}' wordpress)
            if [[ ${wordpress_health} == "healthy" ]]; then
              break
            fi
            if [[ ${wordpress_health} == "unhealthy" ]]; then
              docker logs wordpress
              exit 1
            fi
            echo "wordpress container is not healthy yet"
            sleep 2
          done
          if [[ ${wordpress_health} != "healthy" ]]; then
            docker compose ps
            docker logs wordpress
            exit 1
          fi

          wp_cli_status=""
          for _ in {1..60}; do
            wp_cli_status=$(docker inspect -f '{{.State.Status}}' wp-cli)
            if [[ ${wp_cli_status} == "exited" ]]; then
              break
            fi
            if [[ ${wp_cli_status} != "created" && ${wp_cli_status} != "running" ]]; then
              docker logs wp-cli
              exit 1
            fi
            echo "WP-CLI is still installing WordPress"
            sleep 2
          done
          wp_cli_exit_code=$(docker inspect -f '{{.State.ExitCode}}' wp-cli)
          if [[ ${wp_cli_status} != "exited" || ${wp_cli_exit_code} != "0" ]]; then
            docker compose ps
            docker logs wp-cli
            exit 1
          fi

          docker exec wordpress curl -fsSLo /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          docker exec wordpress chmod +x /usr/local/bin/wp
          docker exec wordpress bash -c 'echo "opcache.enable_cli=1" > /usr/local/etc/php/conf.d/opcache-recommended.ini'
          docker exec wordpress apachectl -t
          docker exec wordpress apachectl -k graceful
          docker exec wordpress wp --allow-root flush-opcache flush
